[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analyzer"
version = "0.1.0"
description = "Analyse d'adversaires Heads-Up NLHE à partir des historiques de mains"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
captures = ["pillow"]  # lecture de captures de ranges (analyzer.theory.extract)

[project.scripts]
hu-analyzer = "analyzer.cli:main"
analyzer-app = "analyzer.app.server:main"

[tool.setuptools.packages.find]
include = ["analyzer*"]

[tool.setuptools.package-data]
"analyzer.app" = ["static/*"]
"analyzer.theory" = ["data/*.json"]
