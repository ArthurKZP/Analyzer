<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorateur — Analyzer HU</title>
<link rel="stylesheet" href="/static/explorer.css">
</head>
<body data-hand="__HAND__">
<header class="top">
  <div class="brand">Analyzer <span>HU</span> · Explorateur</div>
  <div class="hand-meta" id="meta"></div>
  <div class="top-actions">
    <button type="button" id="b-back" title="Revenir d'une étape (←)">◀ Retour</button>
    <button type="button" id="b-line" title="Revenir à la ligne jouée">Ligne jouée</button>
    <button type="button" id="b-train" title="Jouer des mains à partir de ce moment du coup, face au solveur">S'entraîner ici</button>
    <label class="check"><input type="checkbox" id="reveal"> Montrer sa main</label>
  </div>
</header>
<div class="status" id="status" role="status" aria-live="polite"></div>
<nav class="ribbon" id="ribbon" aria-label="Déroulé du coup"></nav>
<main class="layout">
  <section class="left" aria-label="Range">
    <div class="toolbar">
      <div class="seg" id="modes" role="group" aria-label="Affichage"></div>
      <div class="seg" id="players" role="group" aria-label="Range affichée"></div>
    </div>
    <div class="filter-badge" id="filter-badge" hidden></div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="right" aria-label="Détail">
    <div id="overview"></div>
    <div id="mine"></div>
    <div class="rtabs" role="tablist" aria-label="Panneau">
      <button type="button" role="tab" id="tab-combos" aria-selected="true">Mains</button>
      <button type="button" role="tab" id="tab-filters" aria-selected="false">Filtres</button>
    </div>
    <section id="pane-combos" role="tabpanel" aria-labelledby="tab-combos">
      <div class="combos-head"><h2 id="combos-title">Mains</h2><span class="muted small" id="combos-hint">Survole une case pour voir ses combos ; clique pour la garder.</span></div>
      <div class="combos" id="combos"></div>
    </section>
    <section id="pane-filters" role="tabpanel" aria-labelledby="tab-filters" hidden>
      <div id="filters"></div>
    </section>
  </aside>
</main>
<div class="picker" id="picker" hidden></div>
<script src="/static/explorer.js"></script>
</body>
</html>
